name: Collect prices

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install requests brotli

      - name: Get old data
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin history >/dev/null 2>&1; then
            git fetch --depth 1 origin history
            git archive FETCH_HEAD | tar -x -C data
          fi

      - name: Collect prices
        run: python3 tools/collect.py data

      - name: Publish to history branch
        run: |
          cd data
          git init -q
          git checkout -q -b history
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -qm "prices $(date -u +%F-%H)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" history
